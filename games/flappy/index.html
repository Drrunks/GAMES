<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy — Collection GAMES</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="flappy.css">
</head>
<body>
    
    <header>
        <div class="container">
            <a href="../../index.html" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                RETOUR
            </a>
            <h1 class="logo-text"><span>G</span><span>A</span><span>M</span><span>E</span><span>S</span></h1>
            <div style="width: 80px;"></div>
        </div>
    </header>

    <main>
        <div class="game-layout">
            <div class="canvas-container">
                <canvas id="gameCanvas" width="400" height="600"></canvas>
                
                <div id="startScreen" class="overlay">
                    <div class="overlay-content">
                        <div class="icon-hero blue-style">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </div>
                        <h2>FLAPPY</h2>
                        <p>Précision et réflexes requis.</p>
                        <button id="startBtn" class="btn btn-blue">COMMENCER</button>
                    </div>
                </div>
                
                <div id="gameOverScreen" class="overlay hidden">
                    <div class="overlay-content">
                        <h2>FIN DE VOL</h2>
                        <div class="score-display">
                            <span class="score-value" id="finalScore">0</span>
                            <span class="score-label">POINTS</span>
                        </div>
                        <button id="restartBtn" class="btn btn-blue">REESSAYER</button>
                    </div>
                </div>
            </div>
            
            <div class="score-panel">
                <div class="stat-card stat-blue">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="score">0</span>
                        <span class="stat-label">SCORE</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="color: #FFB800">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
                    </div>
                    <div class="stat-content">
                        <span class="stat-value" id="highScore">0</span>
                        <span class="stat-label">RECORD</span>
                    </div>
                </div>
                
                <div class="controls-info">
                    <div class="control-item">
                        <span class="control-key">ESPACE / CLIC</span>
                        <span class="control-desc">VOLER</span>
                    </div>
                    <div class="control-item">
                        <span class="control-key">TOUCHE P</span>
                        <span class="control-desc">PAUSE</span>
                    </div>
                </div>
                
                <button id="pauseBtn" class="btn btn-outline-full">
                    <span id="pauseBtnText">PAUSE</span>
                </button>
            </div>
        </div>
    </main>

    <script src="flappy.js"></script>
</body>
</html>
