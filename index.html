<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES - Portfolio Créatif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#FFB800', 
                        brandPink: '#FF006E',
                        brandOrange: '#FF6B35',
                        brandBlue: '#3A86FF',
                        dark: '#050505'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Space Grotesk', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Flous d'arrière-plan */
        .bg-glow {
            position: fixed;
            width: 45vw;
            height: 45vw;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.12;
        }

        /* Navigation */
        nav {
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid rgba(255, 184, 0, 0.1);
        }

        /* Coloration spécifique du Logo */
        .logo-text {
            letter-spacing: 0.3em;
            font-weight: 700;
        }
        .logo-text span:nth-child(1) { color: #FFB800; } /* G - Or */
        .logo-text span:nth-child(2) { color: #FF006E; } /* A - Rose */
        .logo-text span:nth-child(3) { color: #FF6B35; } /* M - Orange */
        .logo-text span:nth-child(4) { color: #FFB800; } /* E - Or */
        .logo-text span:nth-child(5) { color: #3A86FF; } /* S - Bleu */

        .nav-link {
            color: #ffffff;
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-link:hover {
            border-color: #FFB800;
            color: #FFB800;
            transform: scale(1.05);
        }

        /* Hero Design */
        .hero-title {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .text-gradient {
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-accent-gradient {
            background: linear-gradient(45deg, #FFB800, #FF7A00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-luxury {
            position: relative;
            padding: 1.2rem 3.5rem;
            background: #FFB800;
            color: #000;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-luxury:hover {
            background: #FFFFFF;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 184, 0, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal { animation: fadeInUp 1s ease forwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="bg-glow top-[-10%] left-[-10%]" style="background: #FF006E;"></div>
    <div class="bg-glow bottom-[-10%] right-[-10%]" style="background: #3A86FF;"></div>

    <nav class="fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-6 py-5 flex justify-between items-center">
            <h2 class="logo-text text-2xl">
                <span>G</span><span>A</span><span>M</span><span>E</span><span>S</span>
            </h2>
            <a href="#accueil" class="nav-link">Lancer l'expérience</a>
        </div>
    </nav>

    <section class="min-h-screen flex items-center justify-center px-4 text-center">
        <div class="max-w-4xl">
            <p class="text-accent uppercase tracking-[0.5em] mb-6 text-sm reveal">Premium Gaming Studio</p>
            
            <h1 class="hero-title mb-8 reveal delay-1">
                <span class="text-gradient">L'ART DE LA</span><br>
                <span class="text-accent-gradient">RÉFLEXION</span>
            </h1>

            <p class="text-gray-400 text-lg md:text-xl leading-relaxed mb-12 max-w-2xl mx-auto reveal delay-2">
                Défiez votre esprit avec des expériences conçues pour stimuler votre <span class="text-white">mémoire</span> et sublimer vos instants de <span class="text-white">loisir</span>.
            </p>

            <div class="reveal" style="animation-delay: 0.6s">
                <a href="decouvrir.html" class="btn-luxury">
                    Découvrir
                </a>
            </div>
        </div>
    </section>
</body>
</html>
